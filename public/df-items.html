<!doctype html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ตั้งค่าค่า DF ที่จะให้ Auto</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div style="padding: 36px 24px;">
  <div class="topbar">
    <div class="brand">
      <div class="brand-icon">🧾</div>
      <div>
        <h1 style="margin-bottom:0;">ตั้งค่าค่า DF ที่จะให้ Auto</h1>
        <p class="subtitle" style="margin:0;">เลือกรายการค่าธรรมเนียม แล้วผูกกับห้องตรวจที่ต้องคิดค่านี้ได้หลายห้อง — 1 ห้องตรวจก็ผูกได้หลายรายการเช่นกัน</p>
      </div>
    </div>
    <div class="pill">
      <span id="officerName">-</span>
      <button class="link-btn" onclick="logout()">ออกจากระบบ</button>
    </div>
  </div>

  <a href="insert-df.html" class="back-link" style="max-width:1180px;margin-left:auto;margin-right:auto;display:block;">&larr; กลับ</a>

  <div class="card card-xl" style="margin: 0 auto;">
    <div id="alert" class="alert"></div>

    <h2>1. เลือกรายการค่าธรรมเนียม</h2>
    <div class="field search-wrap" style="max-width:480px;">
      <label>ค้นหารายการ (ชื่อ หรือ icode)</label>
      <input type="text" id="itemSearch" placeholder="พิมพ์ชื่อรายการหรือ icode อย่างน้อย 2 ตัวอักษร">
      <div class="search-results" id="itemResults"></div>
    </div>
    <div id="selectedItemBox" class="summary-box hidden" style="display:block;">
      <div>รายการที่เลือก: <strong id="selectedItemName"></strong></div>
      <input type="hidden" id="selectedItemIcode">
    </div>

    <div id="deptPickerBox" class="hidden">
      <h2 style="margin-top:20px;">2. เลือกห้องตรวจที่จะผูกรายการนี้</h2>
      <div class="field search-wrap" style="max-width:480px;">
        <label>ค้นหาห้องตรวจ (ชื่อหรือรหัส)</label>
        <input type="text" id="deptSearch" placeholder="พิมพ์ชื่อห้องตรวจหรือรหัส">
        <div class="search-results" id="deptResults"></div>
      </div>
    </div>

    <hr class="divider">

    <h2>รายการที่ตั้งค่าไว้</h2>
    <div id="itemsList"></div>
    <div id="itemsEmpty" class="empty-state hidden">ยังไม่มีรายการที่ตั้งค่าไว้</div>
  </div>
</div>

<script src="js/common.js"></script>
<script src="js/df-items.js"></script>
</body>
</html>
